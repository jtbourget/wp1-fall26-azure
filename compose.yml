# Docker Compose configuration for local testing and CI/CD container builds
# The GitHub Actions workflow sets IMAGE_NAME separately for each selected service.
services:
  frontend:
    image: ${IMAGE_NAME:-wp1-frontend:local}
    build: ./frontend
    ports: ["8080:8080"]
    environment:
      - ASPNETCORE_HTTP_PORTS=8080

  api:
    image: ${IMAGE_NAME:-wp1-api:local}
    build: ./api
    ports: ["8081:8080"]
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
